services:
  - type: web
    name: cbd-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cbd-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "1440"
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: ENABLE_REDIS_PROGRESS
        value: "false"
      - key: ENABLE_SOCKET_PROGRESS
        value: "true"
      - key: CORS_ORIGINS
        value: "http://localhost:5173"

databases:
  - name: cbd-postgres
    databaseName: cm_db
    user: cbd_user
    plan: free
