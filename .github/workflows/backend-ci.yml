name: Backend CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cbd_test
          POSTGRES_USER: cbd
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cbd -d cbd_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+psycopg://cbd:test@localhost:5432/cbd_test
      ENABLE_REDIS_PROGRESS: 'false'
      ENABLE_SOCKET_PROGRESS: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pytest unit and PostgreSQL API tests
        run: python -m pytest --require-db --cov=app --cov-report=term-missing --cov-report=xml --junitxml=test-results/pytest.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            coverage.xml
            test-results/pytest.xml
          if-no-files-found: ignore
      - run: docker build --target production -t cbd-backend:ci .
      - run: docker build --target test -t cbd-backend:test .
      - run: docker run --rm -e ENVIRONMENT=test -e ENABLE_REDIS_PROGRESS=false cbd-backend:test
