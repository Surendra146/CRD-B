services:
  - type: web
    name: cbd-frontend
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /data-deletion
        destination: /data-deletion/index.html
      - type: rewrite
        source: /data-deletion/
        destination: /data-deletion/index.html
      - type: rewrite
        source: /privacy-policy
        destination: /privacy-policy/index.html
      - type: rewrite
        source: /privacy-policy/
        destination: /privacy-policy/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: VITE_ENABLE_SOCKET_PROGRESS
        value: "true"

